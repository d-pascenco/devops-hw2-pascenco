- name: Daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# postgresql.conf
- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres__service_name }}.service"
    state: restarted
  become: true

# pg_hba.conf
- name: Reload PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres__service_name }}.service"
    state: reloaded
  become: true

- name: Restart postgres-exporter
  ansible.builtin.systemd_service:
    name: postgres-exporter.service
    state: restarted
  become: true
